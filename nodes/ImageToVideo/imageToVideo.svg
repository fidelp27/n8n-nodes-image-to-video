<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" fill="none">
  <!-- Background rounded rect -->
  <rect width="60" height="60" rx="12" fill="#FF6B6B"/>

  <!-- Photo frame (left) -->
  <rect x="6" y="14" width="22" height="18" rx="3" fill="#fff" opacity="0.95"/>
  <!-- Sun in photo -->
  <circle cx="13" cy="20" r="3" fill="#FFD93D"/>
  <!-- Mountain in photo -->
  <polygon points="9,31 17,21 25,31" fill="#4ECDC4"/>

  <!-- Arrow -->
  <polygon points="31,27 37,30 31,33" fill="#fff" opacity="0.9"/>
  <line x1="28" y1="30" x2="36" y2="30" stroke="#fff" stroke-width="2" opacity="0.9"/>

  <!-- Video / play frame (right) -->
  <rect x="38" y="14" width="16" height="18" rx="3" fill="#fff" opacity="0.25"/>
  <polygon points="43,20 50,23 43,26" fill="#fff"/>

  <!-- Label bar -->
  <rect x="6" y="36" width="48" height="10" rx="3" fill="#fff" opacity="0.15"/>
  <rect x="10" y="39" width="16" height="4" rx="2" fill="#fff" opacity="0.6"/>
  <rect x="30" y="39" width="20" height="4" rx="2" fill="#fff" opacity="0.3"/>
</svg>
